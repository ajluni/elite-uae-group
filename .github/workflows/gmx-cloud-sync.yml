name: GMX Cloud Sync

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Trigger GMX cloud sync
        run: |
          curl --fail --silent --show-error --max-time 60             "https://gmx-cloud-bridge.vercel.app/api/sync-7a6d32f9c4e8"
