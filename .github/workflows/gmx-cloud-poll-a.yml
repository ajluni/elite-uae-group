name: GMX Cloud Poll A

on:
  schedule:
    - cron: '1,7,13,19,25,31,37,43,49,55 * * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/gmx-cloud-poll-a.yml'

permissions:
  contents: read
  id-token: write

jobs:
  trigger-gmx-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: GMX-Cloud-Sync auslösen
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(curl -fsS             -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"             "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=gmx-cloud-cron"             | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          curl -fsS             -H "Authorization: Bearer $TOKEN"             "https://gmx-cloud-cron.vercel.app/api/run-bcc39920fe2c96e042feab18"
